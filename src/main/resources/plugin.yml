name: DeveloperMCP
version: '${version}'
main: io.github.center2055.developermcp.DeveloperMcpPlugin
api-version: '1.20'
description: Lets AI assistants like Claude and Cursor manage the server over the Model Context Protocol.
author: center2055
website: https://modrinth.com/plugin/minecraftdevelopermcp

commands:
  developermcp:
    description: Status, reload and access token of the MCP server
    usage: /<command> <status|reload|token [regenerate]>
    aliases: [dmcp]
    permission: developermcp.admin

permissions:
  developermcp.admin:
    description: Use /developermcp
    default: op
