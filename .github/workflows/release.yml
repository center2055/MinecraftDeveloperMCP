name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: awk -v v="## ${{ steps.version.outputs.VERSION }}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DeveloperMCP ${{ steps.version.outputs.VERSION }}
          files: build/libs/DeveloperMCP-${{ steps.version.outputs.VERSION }}.jar
          body_path: release-notes.md

      - name: Check whether Modrinth already has this version
        id: modrinth
        run: |
          if curl -sf "https://api.modrinth.com/v2/project/minecraftdevelopermcp/version" \
              | grep -q "\"version_number\":\"${{ steps.version.outputs.VERSION }}\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Modrinth
        if: steps.modrinth.outputs.exists == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/DeveloperMCP-${{ steps.version.outputs.VERSION }}.jar
          name: "DeveloperMCP ${{ steps.version.outputs.VERSION }}"
          version: "${{ steps.version.outputs.VERSION }}"
          version-type: release
          changelog-file: release-notes.md
          game-versions: |
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
          loaders: |
            paper
            purpur
            spigot
            bukkit
